# Local development: API + PostgreSQL.   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic"]
      interval: 5s
      retries: 10
  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: local-dev-only
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://clinic:clinic@db:5432/clinic
      SEED_DEMO: "true"
      DEMO_STAFF_PASSWORD: Staff-demo-Pass-123
      DEMO_PATIENT_PASSWORD: Patient-demo-Pass-123
    ports: ["8000:8000"]
