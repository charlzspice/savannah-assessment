# Render Blueprint: New > Blueprint > select this repo.
# Region note: Render has no African region; Frankfurt is the nearest. See docs/COMPLIANCE.md
# (data residency) - this deployment must only ever hold SYNTHETIC data.
databases:
  - name: clinic-db
    databaseName: clinic
    user: clinic
    region: frankfurt
    plan: free            # free Postgres expires after ~30 days; use a paid plan to keep data

services:
  - type: web
    name: clinic-booking-api
    runtime: docker
    region: frankfurt
    plan: free            # free web services sleep when idle (first request is slow)
    branch: main
    autoDeploy: false     # deploys are triggered by GitHub Actions *after* tests pass
    healthCheckPath: /health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_STAFF_PASSWORD
        sync: false       # set in the Render dashboard; share with reviewers privately
      - key: DEMO_PATIENT_PASSWORD
        sync: false
